<style>
  :root{
    --ink:#1B2430; --ink-soft:#5B6472; --ink-faint:#8B93A0;
    --paper:#EFF1EC; --panel:#FFFFFF; --line:#DBDFD6; --line-soft:#E7E9E2;
    --navy:#034459; --navy-soft:#0B5D77; --navy-bg:#E2EEF0;
    --accent:#18E1C9; --accent-ink:#04564C; --accent-bg:#E3FBF7;
    --green:#2F6F4E; --green-bg:#E3EEE7; --green-line:#B9D6C4;
    --red:#8B3A3A; --red-bg:#F3E4E1; --red-line:#E0BEB6;
    --amber:#8A5E14; --amber-bg:#F3EBDB; --amber-line:#E3CE9F;
    --rust:#9C4A22; --rust-bg:#F2E5DB; --rust-line:#E4BFA0;
    --gray:#5F6259; --gray-bg:#E7E7E2; --gray-line:#D2D3CB;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'Roboto Mono',monospace;}
  h1,h2,h3,.display{font-family:'Zilla Slab',serif;}

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--panel);gap:20px;}
  .topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .icon-only-btn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:default;color:var(--ink-faint);position:relative;}
  .account-pill{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:20px;border:1px solid var(--line);cursor:default;color:var(--ink-soft);}
  .account-avatar{width:24px;height:24px;border-radius:50%;background:var(--navy-bg);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .account-name{font-size:13px;font-weight:600;}
  .soon-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);background:var(--gray-bg);padding:2px 6px;border-radius:4px;margin-left:2px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-logo{height:24px;width:auto;display:block;}
  .steps{display:flex;gap:0;align-items:center;}
  .step-dot{display:flex;align-items:center;gap:8px;padding:0 14px;position:relative;}
  .step-dot:not(:last-child)::after{content:"";position:absolute;right:-1px;top:50%;width:22px;height:1px;background:var(--line);}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0;transition:background .2s;}
  .step-dot.active .dot{background:var(--accent);}
  .step-dot.done .dot{background:var(--green);}
  .step-label{font-size:12px;color:var(--ink-faint);}
  .step-dot.active .step-label{color:var(--navy);font-weight:600;}
  .step-dot.done .step-label{color:var(--green);}
  @media (max-width:900px){.steps{display:none;}}

  /* ---------- layout ---------- */
  .stage{max-width:760px;margin:0 auto;padding:56px 24px 96px;}
  .eyebrow{font-size:13px;color:var(--ink-faint);margin-bottom:6px;}
  .headline{font-size:30px;font-weight:600;margin:0 0 10px;line-height:1.2;}
  .sub{color:var(--ink-soft);font-size:15px;line-height:1.55;max-width:56ch;margin:0 0 32px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;border-top:3px solid var(--navy);padding:32px;}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;}
  .btn{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;padding:11px 22px;border-radius:5px;border:1px solid transparent;cursor:pointer;transition:.15s;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-primary:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--ink-faint);color:var(--ink);}

  /* ---------- upload ---------- */
  .dropzone{border:1.5px dashed var(--line);border-radius:6px;padding:48px 24px;text-align:center;cursor:pointer;transition:.15s;}
  .dropzone:hover, .dropzone.drag{border-color:var(--navy);background:var(--navy-bg);}
  .dropzone svg{margin-bottom:14px;}
  .dropzone .dz-title{font-weight:600;font-size:15px;margin-bottom:4px;}
  .dropzone .dz-sub{font-size:13px;color:var(--ink-faint);}
  #fileInput{display:none;}
  .upload-error{margin-top:12px;font-size:13px;color:var(--red);background:var(--red-bg);border:1px solid var(--red-line);border-radius:5px;padding:10px 14px;}
  .file-row{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--navy-bg);border-radius:6px;margin-top:6px;}
  .file-icon{width:34px;height:34px;border-radius:5px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .file-meta{flex:1;min-width:0;}
  .file-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-size{font-size:12px;color:var(--ink-faint);}
  .scan-status{font-size:12px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:6px;}
  .scan-status.pending{color:var(--ink-faint);}

  /* ---------- progress / processing ---------- */
  .process-wrap{padding:64px 0;text-align:center;}
  .ring{width:56px;height:56px;margin:0 auto 24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy);animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .process-title{font-weight:600;font-size:16px;margin-bottom:6px;}
  .process-sub{font-size:13px;color:var(--ink-faint);font-family:'Roboto Mono',monospace;min-height:18px;}

  /* ---------- form fields ---------- */
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
  select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:5px;font-family:'Inter',sans-serif;font-size:14px;background:var(--panel) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%235B6472" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 14px center;appearance:none;color:var(--ink);}
  select:disabled{color:var(--ink-faint);background-color:var(--gray-bg);}
  .extract-list{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .extract-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);}
  .extract-row:last-child{border-bottom:none;}
  .extract-row.disabled{opacity:.5;}
  .extract-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex-shrink:0;}
  .extract-name{font-weight:600;font-size:14px;flex:1;}
  .extract-tag{font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:20px;padding:2px 9px;}

  /* ---------- claim list ---------- */
  .ledger{border:1px solid var(--line);border-radius:6px;overflow:hidden;}
  .claim-row{display:flex;gap:16px;padding:18px 18px;border-bottom:1px solid var(--line-soft);align-items:flex-start;}
  .claim-row:last-child{border-bottom:none;}
  .claim-row.removed{opacity:.4;}
  .claim-num{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--ink-faint);padding-top:2px;width:20px;flex-shrink:0;}
  .claim-text{flex:1;font-size:14.5px;line-height:1.5;}
  .claim-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
  .icon-btn.keep.active{background:var(--green-bg);border-color:var(--green-line);}
  .icon-btn.remove.active{background:var(--red-bg);border-color:var(--red-line);}
  .icon-btn:hover{border-color:var(--ink-faint);}

  /* ---------- evidence ---------- */
  .evi-row{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;overflow:hidden;}
  .evi-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;}
  .evi-claim-text{flex:1;font-size:14px;line-height:1.4;}
  .badge{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid; white-space:nowrap; flex-shrink:0;}
  .badge-verified{color:var(--green);background:var(--green-bg);border-color:var(--green-line);}
  .badge-partial{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line);}
  .badge-contested{color:var(--red);background:var(--red-bg);border-color:var(--red-line);}
  .badge-unsupported{color:var(--gray);background:var(--gray-bg);border-color:var(--gray-line);}
  .chevron{width:16px;height:16px;flex-shrink:0;transition:transform .15s;color:var(--ink-faint);}
  .evi-row.open .chevron{transform:rotate(180deg);}
  .evi-body{max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .evi-row.open .evi-body{max-height:420px;}
  .evi-body-inner{padding:0 18px 20px;border-top:1px solid var(--line-soft);}
  .evi-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin:16px 0;}
  .evi-field{font-size:13px;}
  .evi-field .k{color:var(--ink-faint);margin-bottom:3px;}
  .evi-field .v{font-weight:600;}
  .evi-quote{background:var(--paper);border-left:3px solid var(--navy);padding:12px 14px;font-size:13.5px;line-height:1.5;font-style:italic;color:var(--ink-soft);border-radius:0 4px 4px 0;}

  /* ---------- summary ---------- */
  .stamp-row{display:flex;gap:28px;align-items:center;margin-bottom:32px;}
  .stamp{width:150px;height:150px;border-radius:50%;border:3px solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;position:relative;}
  .stamp::before{content:"";position:absolute;inset:8px;border:1px solid var(--navy);border-radius:50%;opacity:.4;}
  .stamp-score{font-family:'Zilla Slab',serif;font-size:40px;font-weight:700;color:var(--navy);}
  .stamp-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .stat-list{flex:1;}
  .stat-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .stat-row:last-child{border:none;}
  .stat-row .k{color:var(--ink-soft);}
  .stat-row .v{font-weight:700;font-family:'Roboto Mono',monospace;}
  .breakdown{margin-bottom:8px;}
  .breakdown-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line);}
  .seg-supported{background:var(--green);}
  .seg-partly{background:var(--amber);}
  .seg-attention{background:var(--rust);}

function renderStepNav(){
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    let cls = 'step-dot';
    if(i < state.step) cls += ' done';
    if(i === state.step) cls += ' active';
    return `<div class="${cls}"><div class="dot"></div><div class="step-label">${s.label}</div></div>`;
  }).join('');
}

function goTo(i){ state.step = i; render(); window.scrollTo({top:0, behavior:'smooth'}); }
function next(){ goTo(state.step+1); }
function back(){ goTo(state.step-1); }

function render(){
  renderStepNav();
  const fn = RENDERERS[STEPS[state.step].id];
  document.getElementById('stage').innerHTML = fn();
  attachHandlers();
}

    const pctVerified = Math.round(counts.verified/n*100);
    const pctPartial = Math.round(counts.partial/n*100);

            <div class="evi-claim-text">${state.claims.filter(c=>c.kept)[i] ? state.claims.filter(c=>c.kept)[i].text : ''}</div>

                <div class="evi-field"><div class="k">Verification method</div><div class="v">${e.method}</div></div>

              </div>
              <div class="evi-field" style="margin-bottom:12px"><div class="k">Completeness detail</div><div class="v" style="font-weight:500">${e.completeness}</div></div>
              <div class="evi-quote">"${e.quote}"</div>

function attachHandlers(){
  const step = STEPS[state.step].id;

  if(step === 'upload'){
    const dz = document.getElementById('dropzone');
    const input = document.getElementById('fileInput');
    if(dz){
      dz.addEventListener('click', ()=> input.click());
      input.addEventListener('change', e=>{
        if(e.target.files.length) simulateUpload(e.target.files[0]);
      });
      dz.addEventListener('dragover', e=>{e.preventDefault(); dz.classList.add('drag');});
      dz.addEventListener('dragleave', ()=> dz.classList.remove('drag'));
      dz.addEventListener('drop', e=>{
        e.preventDefault(); dz.classList.remove('drag');
        if(e.dataTransfer.files.length) simulateUpload(e.dataTransfer.files[0]);
      });
    }
    const nb = document.getElementById('nextBtn');
    if(nb) nb.addEventListener('click', next);
  }

  if(step === 'configure'){
    document.getElementById('industrySel').addEventListener('change', e=> state.industry = e.target.value);
    document.getElementById('macroSel').addEventListener('change', e=>{
      state.macrotopic = e.target.value; state.topic=''; render();
    });
    document.getElementById('topicSel').addEventListener('change', e=> state.topic = e.target.value);
    document.getElementById('backBtn').addEventListener('click', back);
    document.getElementById('nextBtn').addEventListener('click', ()=>{ next(); runExtraction(); });
  }

  if(step === 'review'){
    document.querySelectorAll('[data-action="keep"], [data-action="remove"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = +btn.dataset.i;
        state.claims[i].kept = btn.dataset.action === 'keep';
        render();
      });
    });
    document.getElementById('backBtn').addEventListener('click', back);
    document.getElementById('nextBtn').addEventListener('click', ()=>{ next(); runEvidenceSearch(); });
  }

  if(step === 'summary'){
    document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        el.closest('.evi-row').classList.toggle('open');
      });
    });
    document.getElementById('restartBtn').addEventListener('click', ()=>{
      Object.assign(state, {step:0, fileName:null, fileSize:null, scanned:false, uploadError:null, industry:'', macrotopic:'', topic:'', claims:[], evidence:[]});
      render();
    });
  }
}

function simulateUpload(file){
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
  if(!isPdf){
    state.uploadError = `"${file.name}" isn't a PDF. Only PDF files are accepted.`;
    render();
    return;
  }
  state.uploadError = null;
  state.fileName = file.name;
  state.fileSize = (file.size/1024).toFixed(0) + ' KB';
  state.scanned = false;
  render();
  setTimeout(()=>{ state.scanned = true; render(); }, 1200);
}

function runExtraction(){
  const messages = ['Reading document structure…','Identifying certification-related passages…','Extracting claim elements…'];
  let i=0;
  const interval = setInterval(()=>{
    const el = document.getElementById('processSub');
    if(el) el.textContent = messages[i % messages.length];
    i++;
  }, 700);
  setTimeout(()=>{
    clearInterval(interval);
    state.claims = MOCK_CLAIMS.map(text=>({text, kept:true}));
    next();
  }, 2200);
}

function runEvidenceSearch(){
  const messages = ['Querying registries…','Matching claims to units…','Scoring evidence…'];
  let i=0;
  const interval = setInterval(()=>{
    const el = document.getElementById('processSub');
    if(el) el.textContent = messages[i % messages.length];
    i++;
  }, 700);
  setTimeout(()=>{
    clearInterval(interval);
    const keptCount = state.claims.filter(c=>c.kept).length;
    state.evidence = MOCK_EVIDENCE.slice(0, keptCount);
    next();
  }, 2200);
}

render();
